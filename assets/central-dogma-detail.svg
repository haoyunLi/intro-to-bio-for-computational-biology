<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img" aria-labelledby="title desc">
<title id="title">Central dogma from DNA to protein, step by step</title>
<desc id="desc">For a protein-coding human gene, DNA is transcribed into an initial RNA, processed into mature messenger RNA, read in three-base codons by a ribosome, and translated into an amino-acid chain that folds into a protein. DNA can also be replicated, and not every RNA is translated.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#2864b4" stroke-width="1.8"/></marker>
</defs>
<rect width="1060" height="410" rx="18" fill="url(#bg)"/>
<rect x="20" y="52" width="617" height="271" rx="15" fill="#edf5ff" stroke="#d5e5f7"/>
<rect x="647" y="52" width="393" height="271" rx="15" fill="#fff8f5" stroke="#edd9d3"/>
<g font-family="Arial,Microsoft YaHei,sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#4b73a6">
 <text x="37" y="38">NUCLEUS / 细胞核</text><text x="663" y="38" fill="#ab6256">CYTOPLASM / 细胞质</text>
</g>
<g fill="#fff" stroke="#c6d9f0" stroke-width="2">
 <rect x="41" y="105" width="175" height="137" rx="12"/>
 <rect x="257" y="105" width="170" height="137" rx="12"/>
 <rect x="470" y="105" width="150" height="137" rx="12"/>
</g>
<g fill="#fff" stroke="#ecc4bc" stroke-width="2">
 <rect x="671" y="105" width="158" height="137" rx="12"/>
 <rect x="871" y="105" width="147" height="137" rx="12"/>
</g>
<g font-family="Arial,Microsoft YaHei,sans-serif" fill="#17365f">
 <g font-size="11" font-weight="700" fill="#2b63af"><text x="57" y="128">01 / DNA</text><text x="273" y="128">02 / PRE-mRNA</text><text x="486" y="128">03 / mRNA</text></g>
 <g font-size="11" font-weight="700" fill="#b65f53"><text x="687" y="128">04 / RIBOSOME</text><text x="887" y="128">05 / PROTEIN</text></g>
 <g font-size="15" font-weight="700"><text x="57" y="167">Gene / 基因</text><text x="273" y="167">初始转录本</text><text x="486" y="167">成熟信使 RNA</text><text x="687" y="167">按密码子读取</text><text x="887" y="167">氨基酸链</text></g>
 <g font-size="12" fill="#5d7897"><text x="57" y="198">双链，有方向</text><text x="273" y="198">exon + intron</text><text x="486" y="198">AUG | GCU | UAA</text><text x="687" y="198">tRNA 搬运氨基酸</text><text x="887" y="198">折叠与修饰</text></g>
</g>
<g fill="none" stroke="#2864b4" stroke-width="2.6" marker-end="url(#arrow)">
 <path d="M219 173h28"/><path d="M430 173h29"/><path d="M623 173h37"/><path d="M831 173h29"/>
</g>
<g font-family="Arial,Microsoft YaHei,sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#2864b4">
 <text x="233" y="95">转录</text><text x="445" y="95">加工</text><text x="643" y="95">输出</text><text x="845" y="95">翻译</text>
</g>
