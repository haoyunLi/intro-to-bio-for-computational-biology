<text x="58" y="276" font-family="Arial,Microsoft YaHei,sans-serif" font-size="11" fill="#597b9f">复制 DNA</text>
<path d="M205 242v48h315" fill="none" stroke="#82a9d9" stroke-width="2" marker-end="url(#arrow)"/>
<text x="254" y="281" font-family="Arial,Microsoft YaHei,sans-serif" font-size="11" fill="#597b9f">另一些基因 → 非编码 RNA 发挥功能</text>
<g font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#385b84">
 <rect x="37" y="338" width="987" height="49" rx="8" fill="#dceafb"/>
 <text x="53" y="368"><tspan font-weight="700">实验读数：</tspan> DNA-seq 看序列 / 变异　·　RNA-seq 看 RNA 丰度 / 剪接　·　proteomics 看蛋白相关信号</text>
</g>
</svg>
