<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">蛋白质从氨基酸序列到多亚基组装</title>
  <desc id="desc">四张卡片依次表示一级结构的线性氨基酸链、二级结构的局部折叠、三级结构的单链整体折叠和四级结构的多链组装。</desc>
  <rect width="1040" height="430" rx="18" fill="#f4f8ff"/>
  <text x="36" y="46" fill="#123d70" font-size="26" font-weight="700" font-family="Arial, sans-serif">同一条信息，可以有不同层次的结构</text>
  <text x="36" y="75" fill="#617b99" font-size="15" font-family="Arial, sans-serif">序列是起点；功能还与形状、相互作用、位置和修饰有关</text>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="30" y="110" width="232" height="269" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/>
      <text x="48" y="146" fill="#1f5a99" font-size="19" font-weight="700">1 · Primary</text>
      <text x="48" y="174" fill="#536f8d" font-size="15">氨基酸顺序</text>
      <path d="M61 255H230" stroke="#a2b9d3" stroke-width="5" stroke-linecap="round"/>
      <g fill="#4a82bd"><circle cx="62" cy="255" r="18"/><circle cx="100" cy="255" r="18"/><circle cx="138" cy="255" r="18"/><circle cx="176" cy="255" r="18"/><circle cx="214" cy="255" r="18"/></g>
      <g fill="white" text-anchor="middle" font-size="13" font-weight="700"><text x="62" y="260">M</text><text x="100" y="260">A</text><text x="138" y="260">K</text><text x="176" y="260">V</text><text x="214" y="260">G</text></g>
      <text x="49" y="365" fill="#5c7490" font-size="13">N 端 → C 端</text>
    </g>
    <g>
      <rect x="280" y="110" width="232" height="269" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/>
      <text x="298" y="146" fill="#1f5a99" font-size="19" font-weight="700">2 · Secondary</text>
      <text x="298" y="174" fill="#536f8d" font-size="15">局部螺旋 / 折叠</text>
      <path d="M315 282C330 210 349 210 366 282S402 354 419 282 452 210 475 282" fill="none" stroke="#55a99e" stroke-width="10" stroke-linecap="round"/>
      <text x="298" y="365" fill="#5c7490" font-size="13">局部氢键帮助稳定</text>
    </g>
    <g>
      <rect x="530" y="110" width="232" height="269" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/>
      <text x="548" y="146" fill="#1f5a99" font-size="19" font-weight="700">3 · Tertiary</text>
      <text x="548" y="174" fill="#536f8d" font-size="15">一条链的整体形状</text>
      <path d="M573 258C610 172 697 212 686 257S608 324 586 283C559 231 700 213 718 284" fill="none" stroke="#e2a15f" stroke-width="12" stroke-linecap="round"/>
      <circle cx="605" cy="246" r="9" fill="#7e64a7"/><circle cx="686" cy="257" r="9" fill="#7e64a7"/>
      <text x="548" y="365" fill="#5c7490" font-size="13">侧链相互作用参与折叠</text>
    </g>
    <g>
      <rect x="780" y="110" width="232" height="269" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/>
      <text x="798" y="146" fill="#1f5a99" font-size="19" font-weight="700">4 · Quaternary</text>
      <text x="798" y="174" fill="#536f8d" font-size="15">多条链组装（若存在）</text>
      <path d="M825 246C844 199 903 204 907 251S852 318 827 286" fill="none" stroke="#e2a15f" stroke-width="13" stroke-linecap="round"/>
      <path d="M898 261C923 210 977 218 980 265S928 313 906 287" fill="none" stroke="#8274b4" stroke-width="13" stroke-linecap="round"/>
      <text x="798" y="365" fill="#5c7490" font-size="13">不是每种蛋白都有这一层</text>
    </g>
  </g>
</svg>
