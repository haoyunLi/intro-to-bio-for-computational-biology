<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" role="img" aria-labelledby="title desc">
  <title id="title">四种膜事件：直接扩散、通道、载体与受体</title>
  <desc id="desc">细胞外在上，细胞内在下。小的非极性分子通过脂质双层，离子经通道、营养分子经载体；信号配体结合受体后可触发胞内反应，不必自己穿膜。</desc>
  <rect width="1060" height="520" rx="20" fill="#f4f8ff"/>
  <text x="34" y="45" fill="#173d77" font-family="Arial, sans-serif" font-size="26" font-weight="700">遇到细胞膜：四条路线，四种问题</text>
  <text x="34" y="74" fill="#617b99" font-family="Arial, sans-serif" font-size="16">上方 = 细胞外；下方 = 细胞内。箭头表示教学示例中的方向，真实方向取决于浓度、电位和细胞状态。</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="28" y="112" width="238" height="355" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><text x="147" y="148" fill="#1f5a99" font-size="20" font-weight="700">01 · 直接扩散</text><text x="147" y="178" fill="#597690" font-size="15">小的非极性分子</text><text x="147" y="217" fill="#c26c56" font-size="20" font-weight="700">O₂</text><path d="M147 229v114" stroke="#dc8b75" stroke-width="5" stroke-linecap="round"/><path d="M135 331l12 15 12-15" fill="none" stroke="#dc8b75" stroke-width="5"/><text x="147" y="424" fill="#173d77" font-size="15">可穿过脂质核心</text></g>
    <g><rect x="283" y="112" width="238" height="355" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><text x="402" y="148" fill="#1f5a99" font-size="20" font-weight="700">02 · 通道</text><text x="402" y="178" fill="#597690" font-size="15">离子需要合适的通路</text><text x="402" y="217" fill="#4b83c2" font-size="20" font-weight="700">Na⁺</text><rect x="378" y="252" width="48" height="87" rx="15" fill="#dceaf7" stroke="#5e90c4" stroke-width="4"/><rect x="392" y="251" width="20" height="88" rx="9" fill="#fff"/><path d="M402 226v116" stroke="#4b83c2" stroke-width="4"/><path d="M391 331l11 14 11-14" fill="none" stroke="#4b83c2" stroke-width="4"/><text x="402" y="424" fill="#173d77" font-size="15">开放状态和梯度重要</text></g>
    <g><rect x="538" y="112" width="238" height="355" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><text x="657" y="148" fill="#1f5a99" font-size="20" font-weight="700">03 · 载体</text><text x="657" y="178" fill="#597690" font-size="15">结合后改变构象</text><text x="657" y="217" fill="#4f9e8d" font-size="20" font-weight="700">营养分子</text><path d="M628 260q29-25 58 0v69q-29 27-58 0z" fill="#dff1eb" stroke="#67ad9c" stroke-width="4"/><circle cx="657" cy="286" r="9" fill="#4f9e8d"/><path d="M657 226v24M657 333v17" stroke="#4f9e8d" stroke-width="4"/><path d="M647 340l10 13 10-13" fill="none" stroke="#4f9e8d" stroke-width="4"/><text x="657" y="424" fill="#173d77" font-size="15">蛋白丰度 ≠ 实际流量</text></g>
    <g><rect x="793" y="112" width="238" height="355" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><text x="912" y="148" fill="#1f5a99" font-size="20" font-weight="700">04 · 受体</text><text x="912" y="178" fill="#597690" font-size="15">识别信号并传到内部</text><circle cx="912" cy="216" r="15" fill="#a977b7"/><text x="912" y="222" fill="#fff" font-size="14" font-weight="700">L</text><path d="M883 252l29 28 29-28M912 280v67" fill="none" stroke="#a977b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M912 351l-27 30M912 351l27 30" stroke="#a977b7" stroke-width="5"/><text x="912" y="424" fill="#173d77" font-size="15">配体不必自己穿膜</text></g>
  </g>
  <path d="M42 270h988M42 318h988" stroke="#7fb0c5" stroke-width="3" stroke-dasharray="8 7" opacity=".72"/>
  <text x="34" y="498" fill="#617b99" font-family="Arial, sans-serif" font-size="14">模型只说明机制类别；某些受体也可能内吞，某些运输蛋白需要能量或耦合梯度。</text>
</svg>
