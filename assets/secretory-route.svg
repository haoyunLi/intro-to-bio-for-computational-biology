<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 435" role="img" aria-labelledby="title desc">
  <title id="title">细胞中的蛋白从指令到膜表面的路线</title>
  <desc id="desc">细胞核内 DNA 转录为 RNA，RNA 到细胞质，在粗面内质网相关核糖体翻译，蛋白经内质网、高尔基体及囊泡到达膜表面。游离核糖体制作的部分蛋白走其他路线。</desc>
  <rect width="1040" height="435" rx="20" fill="#f4f8ff"/>
  <text x="34" y="45" fill="#173d77" font-family="Arial, sans-serif" font-size="26" font-weight="700">受体要到膜表面，中间还有一段路</text>
  <text x="34" y="75" fill="#617b99" font-family="Arial, sans-serif" font-size="16">教学示例：一个需要走分泌途径的膜受体。不是所有蛋白都经过 ER → Golgi。</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="28" y="119" width="182" height="213" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><circle cx="119" cy="216" r="48" fill="#dce8f7" stroke="#7398c9" stroke-width="3"/><path d="M94 208q25-29 50 0t-50 0M94 224q25-26 50 0" fill="none" stroke="#5175ad" stroke-width="5"/><text x="119" y="153" fill="#1f5a99" font-size="19" font-weight="700">细胞核</text><text x="119" y="303" fill="#597690" font-size="15">DNA → RNA</text></g>
    <g><rect x="230" y="119" width="182" height="213" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><path d="M270 190q50-19 101 0M270 213q50-19 101 0M270 236q50-19 101 0" fill="none" stroke="#77a9b9" stroke-width="9" stroke-linecap="round"/><g fill="#315e9c"><circle cx="287" cy="180" r="5"/><circle cx="320" cy="176" r="5"/><circle cx="351" cy="181" r="5"/></g><text x="321" y="153" fill="#1f5a99" font-size="19" font-weight="700">粗面 ER</text><text x="321" y="303" fill="#597690" font-size="15">翻译、折叠</text></g>
    <g><rect x="432" y="119" width="182" height="213" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><path d="M472 189q50-12 101 0M478 208q44-10 89 0M484 228q38-8 77 0M491 247q31-6 63 0" fill="none" stroke="#9b87bb" stroke-width="10" stroke-linecap="round"/><text x="523" y="153" fill="#1f5a99" font-size="19" font-weight="700">高尔基体</text><text x="523" y="303" fill="#597690" font-size="15">修饰、分选</text></g>
    <g><rect x="634" y="119" width="182" height="213" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><circle cx="725" cy="215" r="44" fill="#e7f4ef" stroke="#66a995" stroke-width="5"/><path d="M700 215h50" stroke="#66a995" stroke-width="7"/><text x="725" y="153" fill="#1f5a99" font-size="19" font-weight="700">运输囊泡</text><text x="725" y="303" fill="#597690" font-size="15">送往目的地</text></g>
    <g><rect x="836" y="119" width="182" height="213" rx="14" fill="#fff" stroke="#d6e4f4" stroke-width="2"/><path d="M862 205h130M862 225h130" stroke="#7ab1c1" stroke-width="9" stroke-linecap="round"/><path d="M920 187v58M901 188l19-18 19 18" fill="none" stroke="#d17a8a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="927" y="153" fill="#1f5a99" font-size="19" font-weight="700">细胞膜</text><text x="927" y="303" fill="#597690" font-size="15">表面受体可接触配体</text></g>
  </g>
  <g fill="#7396b8" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle"><text x="220" y="229">→</text><text x="422" y="229">→</text><text x="624" y="229">→</text><text x="826" y="229">→</text></g>
  <text x="34" y="380" fill="#173d77" font-family="Arial, sans-serif" font-size="16" font-weight="700">测量层：</text>
  <text x="118" y="380" fill="#597690" font-family="Arial, sans-serif" font-size="15">RNA-seq 看 RNA；整细胞蛋白组看总蛋白；表面染色或定位成像才更接近“膜上有多少”。</text>
  <text x="34" y="412" fill="#617b99" font-family="Arial, sans-serif" font-size="14">图中箭头不代表每一步必然成功，折叠、分选和回收/降解都可能改变最终表面数量。</text>
</svg>
