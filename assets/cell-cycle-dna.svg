<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">二倍体细胞的细胞周期与 DNA 含量</title>
  <desc id="desc">G1 为 2n 2C；S 期复制 DNA，含量从 2C 增至 4C；G2 为 2n 4C；M 期分离姐妹染色单体，两个子细胞各恢复为 2n 2C。</desc>
  <rect width="1040" height="470" rx="18" fill="#f4f8ff"/>
  <text x="34" y="47" fill="#123d70" font-size="26" font-weight="700" font-family="Arial, sans-serif">DNA 量变了，倍性不一定变</text>
  <text x="34" y="76" fill="#617b99" font-size="15" font-family="Arial, sans-serif">教学示意：一对同源染色体代表普通二倍体细胞的变化</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="28" y="119" width="218" height="278" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/><text x="137" y="153" fill="#1f5a99" font-size="21" font-weight="700">G1</text><text x="137" y="181" fill="#597690" font-size="15">准备复制</text><path d="M100 226v86M168 226v86" stroke="#5aa89c" stroke-width="14" stroke-linecap="round"/><text x="137" y="359" fill="#174879" font-size="19" font-weight="700">2n · 2C</text></g>
    <g><rect x="283" y="119" width="218" height="278" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/><text x="392" y="153" fill="#1f5a99" font-size="21" font-weight="700">S</text><text x="392" y="181" fill="#597690" font-size="15">复制 DNA</text><path d="M346 226v86M414 226v86" stroke="#5aa89c" stroke-width="14" stroke-linecap="round"/><path d="M354 248v64M422 248v64" stroke="#b7dcd8" stroke-width="13" stroke-linecap="round"/><text x="392" y="359" fill="#174879" font-size="19" font-weight="700">2n · 2C → 4C</text></g>
    <g><rect x="538" y="119" width="218" height="278" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/><text x="647" y="153" fill="#1f5a99" font-size="21" font-weight="700">G2</text><text x="647" y="181" fill="#597690" font-size="15">复制完成</text><path d="M610 228v85M627 228v85M677 228v85M694 228v85" stroke="#668fbe" stroke-width="10" stroke-linecap="round"/><text x="647" y="359" fill="#174879" font-size="19" font-weight="700">2n · 4C</text></g>
    <g><rect x="793" y="119" width="218" height="278" rx="13" fill="#ffffff" stroke="#d6e4f4" stroke-width="2"/><text x="902" y="153" fill="#1f5a99" font-size="21" font-weight="700">M → 子细胞</text><text x="902" y="181" fill="#597690" font-size="15">姐妹染色单体分离</text><circle cx="850" cy="267" r="39" fill="#edf6f4" stroke="#a8d3ca"/><circle cx="952" cy="267" r="39" fill="#edf6f4" stroke="#a8d3ca"/><path d="M837 247v39M862 247v39M939 247v39M964 247v39" stroke="#5aa89c" stroke-width="8" stroke-linecap="round"/><text x="902" y="359" fill="#174879" font-size="19" font-weight="700">各 2n · 2C</text></g>
    <g fill="#7396b8" font-size="27" font-weight="700"><text x="263" y="273">→</text><text x="518" y="273">→</text><text x="773" y="273">→</text></g>
  </g>
  <text x="34" y="438" fill="#617b99" font-size="14" font-family="Arial, sans-serif">n：同源染色体组数；C：以一套单倍体基因组为单位的 DNA 含量。肿瘤细胞可能偏离这张典型图。</text>
</svg>
